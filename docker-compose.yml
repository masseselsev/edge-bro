services:
  db:
    image: postgres:18-alpine
    restart: always
    # The default max_connections of 100 is tight once Celery prefork is in
    # play: every worker child carries its own SQLAlchemy pool, and long tasks
    # hold a connection for the duration of a borg transfer.
    command: >
      postgres -c max_connections=${POSTGRES_MAX_CONNECTIONS:-200}
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Pinned, not left to the image default. PostgreSQL 18's official image
      # moved its default PGDATA to /var/lib/postgresql/18/docker; every
      # existing deployment has its cluster at the old path, and an unpinned
      # 18 would initialise an empty one beside it and start up looking fine.
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      # Loopback only. Nothing outside this host has any business reaching
      # Postgres directly, and "0.0.0.0:5432" put the fleet's entire database
      # on the LAN behind one password. Containers reach it over the compose
      # network by service name and are unaffected; `psql -h localhost` from
      # the host still works.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: always
    ports:
      # Loopback only, as above. Redis has no password, and it holds the
      # backup locks and the Celery queue: anything that can write here can
      # stop every backup in the fleet or forge a task.
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    image: ghcr.io/masseselsev/edge-bro-backend:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: always
    command: /app/entrypoint.sh
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      # Must be identical in every service: backend derives the SSH
      # forced command from it while the workers route nodes by it.
      BORG_SHARD_COUNT: ${BORG_SHARD_COUNT:-1}
      BORG_LOCK_WAIT_SECONDS: ${BORG_LOCK_WAIT_SECONDS:-600}
      BORG_MAINTENANCE_TTL: ${BORG_MAINTENANCE_TTL:-900}
      BORG_WRITER_TTL: ${BORG_WRITER_TTL:-14400}
      BORG_DELETE_BATCH: ${BORG_DELETE_BATCH:-200}
      BORG_PRUNE_DRY_RUN: ${BORG_PRUNE_DRY_RUN:-}
      ORCHESTRATOR_IP: ${ORCHESTRATOR_IP}
      BORG_HOST_DATA_PATH: ${BORG_HOST_DATA_PATH}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      RESET_SUPERADMIN_PASSWORD: ${RESET_SUPERADMIN_PASSWORD:-}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SSH_KEEPALIVE_INTERVAL: ${SSH_KEEPALIVE_INTERVAL:-30}
      SSH_KEEPALIVE_COUNT: ${SSH_KEEPALIVE_COUNT:-3}
    volumes:
      - ${BORG_HOST_DATA_PATH:-borg-data}:/data/borg
      - ssh-keys:/root/.ssh
      - ${ISO_CACHE_HOST_PATH:-iso-cache}:/opt/data/iso_cache
      - /proc:/host/proc:ro
      - frontend-build:/opt/frontend_build
    ports:
      - "8000:8000"
    healthcheck:
      # /api/version is unauthenticated by design and touches no database.
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/api/version || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    depends_on:
      # Ready, not merely started. Plain `depends_on` only waits for the
      # container to exist, so every service raced Postgres accepting
      # connections and relied on restart:always to eventually win.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - ${UPSTREAM_DNS:-8.8.8.8}
      - ${SITE_DNS:-${UPSTREAM_DNS:-8.8.8.8}}

  worker:
    image: ghcr.io/masseselsev/edge-bro-backend:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: always
    # Bare-metal restore runs here: it partitions disks, formats them, mounts
    # the result and chroots into it. That needs the whole capability set and
    # /dev, so this one stays privileged. Everything it reaches is on the
    # backups and iso queues; see celery_app.py for the routing.
    privileged: true
    # Long work only: borg transfers, ansible runs, ISO builds. Kept off the
    # periodic queue so a multi-hour backup can never delay a 60s scheduler
    # tick — which is what a single undifferentiated worker allowed, since a
    # few long tasks could hold every prefetched slot.
    # -Ofair stops a free child being skipped because another is mid-task.
    command: >
      celery -A tasks.celery_app worker -Q backups,iso
      --concurrency=${CELERY_BACKUP_CONCURRENCY:-8} -Ofair
      --hostname=backups@%h --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      # Must be identical in every service: backend derives the SSH
      # forced command from it while the workers route nodes by it.
      BORG_SHARD_COUNT: ${BORG_SHARD_COUNT:-1}
      BORG_LOCK_WAIT_SECONDS: ${BORG_LOCK_WAIT_SECONDS:-600}
      BORG_MAINTENANCE_TTL: ${BORG_MAINTENANCE_TTL:-900}
      BORG_WRITER_TTL: ${BORG_WRITER_TTL:-14400}
      BORG_DELETE_BATCH: ${BORG_DELETE_BATCH:-200}
      BORG_PRUNE_DRY_RUN: ${BORG_PRUNE_DRY_RUN:-}
      ORCHESTRATOR_IP: ${ORCHESTRATOR_IP}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SSH_KEEPALIVE_INTERVAL: ${SSH_KEEPALIVE_INTERVAL:-30}
      SSH_KEEPALIVE_COUNT: ${SSH_KEEPALIVE_COUNT:-3}
    volumes:
      - /dev:/dev
      - ${BORG_HOST_DATA_PATH:-borg-data}:/data/borg
      - ssh-keys:/root/.ssh
      - ${ISO_CACHE_HOST_PATH:-iso-cache}:/opt/data/iso_cache
      - frontend-build:/opt/frontend_build
      - /proc:/host/proc:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - ${UPSTREAM_DNS:-8.8.8.8}
      - ${SITE_DNS:-${UPSTREAM_DNS:-8.8.8.8}}

  worker-periodic:
    image: ghcr.io/masseselsev/edge-bro-backend:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    # Not privileged, and no /dev. This pool runs the scheduler tick, the
    # reachability sweep, the monitoring and alert sweeps and the prunes -
    # database, Redis and SSH, none of which touches a block device. It was
    # copied from the worker above along with privileges it never used.
    # Short, timer-driven work: the scheduler tick, the reachability sweep,
    # the monitoring and alert sweeps, the nightly prunes. Its own pool so it
    # stays responsive no matter how backed up the backup queue is.
    command: >
      celery -A tasks.celery_app worker -Q periodic
      --concurrency=${CELERY_PERIODIC_CONCURRENCY:-4} -Ofair
      --hostname=periodic@%h --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      # Must be identical in every service: backend derives the SSH
      # forced command from it while the workers route nodes by it.
      BORG_SHARD_COUNT: ${BORG_SHARD_COUNT:-1}
      BORG_LOCK_WAIT_SECONDS: ${BORG_LOCK_WAIT_SECONDS:-600}
      BORG_MAINTENANCE_TTL: ${BORG_MAINTENANCE_TTL:-900}
      BORG_WRITER_TTL: ${BORG_WRITER_TTL:-14400}
      BORG_DELETE_BATCH: ${BORG_DELETE_BATCH:-200}
      BORG_PRUNE_DRY_RUN: ${BORG_PRUNE_DRY_RUN:-}
      ORCHESTRATOR_IP: ${ORCHESTRATOR_IP}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SSH_KEEPALIVE_INTERVAL: ${SSH_KEEPALIVE_INTERVAL:-30}
      SSH_KEEPALIVE_COUNT: ${SSH_KEEPALIVE_COUNT:-3}
    volumes:
      - ${BORG_HOST_DATA_PATH:-borg-data}:/data/borg
      - ssh-keys:/root/.ssh
      - ${ISO_CACHE_HOST_PATH:-iso-cache}:/opt/data/iso_cache
      - frontend-build:/opt/frontend_build
      - /proc:/host/proc:ro
      # Mounted only here, and only for the weekly image prune - which routes
      # to this queue. The socket is unrestricted root on the host, so the
      # backup worker, which does not use it, no longer has it. The task
      # itself skips cleanly when the socket is absent.
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      # Ready, not merely started. Plain `depends_on` only waits for the
      # container to exist, so every service raced Postgres accepting
      # connections and relied on restart:always to eventually win.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    dns:
      - ${UPSTREAM_DNS:-8.8.8.8}
      - ${SITE_DNS:-${UPSTREAM_DNS:-8.8.8.8}}

  beat:
    image: ghcr.io/masseselsev/edge-bro-backend:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: ./backend
      dockerfile: ../docker/backend/Dockerfile
    restart: always
    command: celery -A tasks.celery_app beat --loglevel=info
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      BORG_PASSPHRASE: ${BORG_PASSPHRASE}
      # Must be identical in every service: backend derives the SSH
      # forced command from it while the workers route nodes by it.
      BORG_SHARD_COUNT: ${BORG_SHARD_COUNT:-1}
      BORG_LOCK_WAIT_SECONDS: ${BORG_LOCK_WAIT_SECONDS:-600}
      BORG_MAINTENANCE_TTL: ${BORG_MAINTENANCE_TTL:-900}
      BORG_WRITER_TTL: ${BORG_WRITER_TTL:-14400}
      BORG_DELETE_BATCH: ${BORG_DELETE_BATCH:-200}
      BORG_PRUNE_DRY_RUN: ${BORG_PRUNE_DRY_RUN:-}
      ORCHESTRATOR_IP: ${ORCHESTRATOR_IP}
      PYTHONPATH: /app
      SUPERADMIN_USERNAME: ${SUPERADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      SSH_KEEPALIVE_INTERVAL: ${SSH_KEEPALIVE_INTERVAL:-30}
      SSH_KEEPALIVE_COUNT: ${SSH_KEEPALIVE_COUNT:-3}
    volumes:
      - ${BORG_HOST_DATA_PATH:-borg-data}:/data/borg
      - ssh-keys:/root/.ssh
    depends_on:
      # Ready, not merely started. Plain `depends_on` only waits for the
      # container to exist, so every service raced Postgres accepting
      # connections and relied on restart:always to eventually win.
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  borg-server:
    image: ghcr.io/masseselsev/edge-bro-borg-server:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/borg/Dockerfile
    restart: always
    ports:
      - "12345:22"
    volumes:
      - ${BORG_HOST_DATA_PATH:-borg-data}:/data/borg
      - ssh-keys:/home/borg/.ssh
      # Keeps the server's SSH identity stable across rebuilds; without it every
      # node's known_hosts entry is invalidated and backups stop.
      - borg-hostkeys:/etc/ssh/keys
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ghcr.io/masseselsev/edge-bro-frontend:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: ./frontend
      dockerfile: ../docker/frontend/Dockerfile
    restart: always
    ports:
      - "7777:7777"
    volumes:
      - frontend-build:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy

  apt-proxy:
    image: ghcr.io/masseselsev/edge-bro-apt-proxy:${EDGE_BRO_IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: docker/apt-proxy/Dockerfile
    restart: always
    ports:
      - "3142:3142"
    volumes:
      - apt-cache:/var/cache/apt-cacher-ng
    dns:
      - ${UPSTREAM_DNS:-8.8.8.8}
      - ${SITE_DNS:-${UPSTREAM_DNS:-8.8.8.8}}

# Fixed volume names keep data attached even if the stack directory is renamed.
# external: false lets Compose create them on first run.
volumes:
  pg-data:
    name: edge-bro_pg-data
    external: false
  borg-data:
    name: edge-bro_borg-data
    external: false
  ssh-keys:
    name: edge-bro_ssh-keys
    external: false
  borg-hostkeys:
    name: edge-bro_borg-hostkeys
    external: false
  redis-data:
    name: edge-bro_redis-data
    external: false
  iso-cache:
    name: edge-bro_iso-cache
    external: false
  frontend-build:
    name: edge-bro_frontend-build
    external: false
  apt-cache:
    name: edge-bro_apt-cache
    external: false


# Docker picks a subnet for this network from its own pool when none is given,
# walking 172.17.0.0/16, 172.18.0.0/16 and upwards. On a host that already
# routes one of those — a VPN, a site-to-site tunnel, a second Docker network —
# the collision is silent and total: the longest matching prefix wins, so
# traffic the host sends to a container goes out the tunnel instead of the
# bridge. Containers still talk to each other, which is what makes it
# confusing, but every published port stops working. That is the API on 8000,
# the borg endpoint on 12345 that every node pushes backups to, and the apt
# proxy — the whole deployment, unreachable, with healthy containers.
#
# So the subnet is stated rather than left to chance, and a /24 is used because
# it collides with far less than a /16. It is overridable because no single
# range is safe everywhere: if this one clashes with your network, set
# DOCKER_SUBNET in .env to one that does not.
#
# Changing it recreates the network, which requires the stack to be stopped:
#   docker compose down && docker compose up -d
networks:
  default:
    name: edge-bro_default
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.29.13.0/24}
